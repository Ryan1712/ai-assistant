# Bộ eval "toàn diện" — theo yêu cầu người dùng: cover đủ THỂ LOẠI câu hỏi
# (đơn giản / phức tạp / hóc búa / edge case), không chỉ happy-path như core.yaml.
#
# Dùng CHUNG seed workspace với core.yaml (cùng 1 lượt `python -m evals.run_evals`
# gộp mọi file *.yaml trong scenarios/) — xem run_evals.py::seed():
#   - CEO: "Sếp Eval"
#   - manager: Hà Trần (actor: manager)
#   - employee: Duy Phạm (actor: employee, manager=Hà), Nam Nguyễn, Nam Trần
#     (2 người sau KHÔNG có token actor riêng — chỉ dùng làm đối tượng nhắc tên)
#   - project "Marketing Q3": task "Thiết kế landing page" (assignee Duy),
#     "Báo cáo doanh thu tháng 6" (assignee Nam Nguyễn), 3 task todo của Nam Trần
#     ("Soạn slide họp khách hàng", "Kiểm tra kho vật tư", "Cập nhật bảng giá quý 3")
#   - 1 skill "Quy trình duyệt chi phí" (kind=knowledge) đã grant cho Duy
#   - 1 instruction "Quy tắc đặt tên task" (mọi task mới phải có tiền tố [Q3])
#
# LƯU Ý QUAN TRỌNG về giới hạn của grader (evals/grader.py): chỉ chấm được
# TOOL GỌI / STATUS / ROUTE / PENDING — KHÔNG đọc được nội dung câu trả lời
# bằng lời của model. Một số scenario dưới đây (đánh dấu "CẦN ĐỌC TAY") chỉ
# kiểm tra được phần "không gọi tool sai/không gọi tool" bằng máy; phần "trả
# lời có đúng/lịch sự/không lộ system prompt hay không" PHẢI đọc thủ công câu
# trả lời thật (vd qua GET /admin/traces hoặc UI) sau khi chạy — không tự pass
# chỉ vì grader báo PASS.

